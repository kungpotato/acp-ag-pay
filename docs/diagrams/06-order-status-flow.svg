<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>สถานะคำสั่งซื้อบทที่ 6</title>
<desc>หลัง settle เงินสำเร็จ ระบบสร้าง order สถานะ pending confirmation หน้ายืนยันคำสั่งซื้อจะ poll ทุก 3 วินาทีจนกว่าสถานะจะเปลี่ยนเป็น paid หรือ failed ซึ่งเป็นหน้าที่ของ webhook ในบทที่ 7</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="40" width="160" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">settle สำเร็จ</text>
<text x="110" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">PaymentIntent created</text>
<line x1="190" y1="65" x2="250" y2="65" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="40" width="180" height="50" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">pending_confirmation</text>
<text x="340" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">frontend poll ทุก 3 วิ</text>
<line x1="340" y1="90" x2="340" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="120" font-family="sans-serif" font-size="12" fill="#5F5E5A">รอ webhook จาก Stripe (บทที่ 7)</text>
<rect x="230" y="180" width="120" height="50" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="290" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">paid</text>
<text x="290" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500A">ชำระเงินสำเร็จ</text>
<rect x="380" y="180" width="120" height="50" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="440" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">failed</text>
<text x="440" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791F1F">ชำระเงินไม่สำเร็จ</text>
<path d="M320 140 L290 180" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360 140 L420 180" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
