<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ลำดับการสร้าง checkout session บทที่ 4</title>
<desc>ผู้ใช้เพิ่มหนังสือลงตะกร้าในฝั่ง frontend แล้วกดสร้าง checkout session ซึ่งส่ง product id และจำนวนไปยัง SessionHandler จากนั้น SessionStore ตรวจสอบราคาจริงจาก catalog store จองสต๊อก แล้วสร้าง session สถานะ pending กลับไป</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="80" y1="60" x2="80" y2="350" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="260" y1="60" x2="260" y2="350" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="440" y1="60" x2="440" y2="350" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="600" y1="60" x2="600" y2="350" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<rect x="20" y="30" width="120" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ผู้ใช้</text>
<rect x="200" y="30" width="120" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="260" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">CartPanel</text>
<rect x="380" y="30" width="120" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="440" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">SessionHandler</text>
<rect x="540" y="30" width="120" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">catalog.Store</text>
<line x1="80" y1="90" x2="260" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="82" font-family="sans-serif" font-size="12" fill="#5F5E5A">กด "สร้าง checkout session"</text>
<line x1="260" y1="130" x2="440" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="122" font-family="sans-serif" font-size="12" fill="#5F5E5A">POST checkout_sessions</text>
<line x1="440" y1="170" x2="600" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="162" font-family="sans-serif" font-size="12" fill="#5F5E5A">ตรวจราคา + จองสต๊อก</text>
<line x1="600" y1="210" x2="440" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="202" font-family="sans-serif" font-size="12" fill="#5F5E5A">ok / insufficient stock</text>
<text x="450" y="245" font-family="sans-serif" font-size="12" fill="#5F5E5A">ถ้าล้มเหลว → rollback รายการที่จองแล้ว</text>
<line x1="440" y1="280" x2="260" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="272" font-family="sans-serif" font-size="12" fill="#5F5E5A">session (pending, total)</text>
<line x1="260" y1="320" x2="80" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="312" font-family="sans-serif" font-size="12" fill="#5F5E5A">แสดง session id และยอดรวม</text>
</svg>
