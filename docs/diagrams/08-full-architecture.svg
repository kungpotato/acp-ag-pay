<text x="125" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">บทที่ 1</text>
<rect x="205" y="140" width="130" height="55" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="270" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">agent</text>
