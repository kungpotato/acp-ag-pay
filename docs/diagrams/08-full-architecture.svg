<text x="342" y="425" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">ค้นหา (2) → เพิ่มตะกร้า (4) → checkout session (4) → settle (5)</text>
<text x="342" y="443" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">→ order pending_confirmation (6) → webhook ยืนยัน (7) → paid</text>
