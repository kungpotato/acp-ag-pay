<rect x="180" y="30" width="320" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Next.js frontend</text>
<text x="340" y="73" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">catalog · chat · cart · order status</text>
<text x="340" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">บทที่ 1, 2, 4, 6</text>
