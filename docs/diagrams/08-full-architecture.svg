<text x="560" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">payment</text>
<text x="560" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">บทที่ 5</text>
<line x1="415" y1="195" x2="415" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="195" x2="560" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
