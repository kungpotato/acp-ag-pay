<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>สถาปัตยกรรมสรุปรวมทั้ง 7 บทเรียน</title>
<desc>Next.js frontend ประกอบด้วยหน้าแคตตาล็อก แชท agent ตะกร้า และหน้ายืนยันคำสั่งซื้อ เรียก Go backend ที่แบ่งเป็นโมดูล catalog สำหรับหนังสือ agent สำหรับแปลความต้องการ acp สำหรับ product feed checkout session และ order payment สำหรับสร้าง PaymentIntent และ webhook สำหรับรับการยืนยันจาก Stripe แบบ async</desc>
