<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ลำดับการทำงานของ shopping agent ในบทที่ 2</title>
<desc>ผู้ใช้พิมพ์ข้อความไปยัง frontend ซึ่งส่งต่อไปยัง agent handler จากนั้น agent ลองใช้ LLM parser ก่อนถ้ามี API key ถ้าไม่มีหรือเรียกไม่สำเร็จจะ fallback ไปใช้ rule-based parser แล้วค้นหาหนังสือจาก catalog store และตอบกลับผู้ใช้</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="80" y1="60" x2="80" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="260" y1="60" x2="260" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="440" y1="60" x2="440" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="600" y1="60" x2="600" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<rect x="20" y="30" width="120" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ผู้ใช้</text>
<rect x="200" y="30" width="120" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="260" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Frontend</text>
<rect x="380" y="30" width="120" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="440" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Agent handler</text>
<rect x="540" y="30" width="120" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Catalog store</text>
<line x1="80" y1="90" x2="260" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="82" font-family="sans-serif" font-size="12" fill="#5F5E5A">พิมพ์ข้อความ</text>
<line x1="260" y1="120" x2="440" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="112" font-family="sans-serif" font-size="12" fill="#5F5E5A">POST /api/agent/chat</text>
<line x1="440" y1="160" x2="440" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="150" font-family="sans-serif" font-size="12" fill="#5F5E5A">มี OPENROUTER_API_KEY?</text>
<text x="450" y="185" font-family="sans-serif" font-size="12" fill="#5F5E5A">ใช่ → เรียก LLM parser</text>
<text x="450" y="215" font-family="sans-serif" font-size="12" fill="#5F5E5A">ไม่/ล้มเหลว → rule-based parser</text>
<line x1="440" y1="250" x2="600" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="242" font-family="sans-serif" font-size="12" fill="#5F5E5A">Search(query)</text>
<line x1="600" y1="280" x2="440" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="272" font-family="sans-serif" font-size="12" fill="#5F5E5A">[]Book</text>
<line x1="440" y1="320" x2="260" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="312" font-family="sans-serif" font-size="12" fill="#5F5E5A">reply + books</text>
<line x1="260" y1="360" x2="80" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="352" font-family="sans-serif" font-size="12" fill="#5F5E5A">แสดงคำตอบในแชท</text>
