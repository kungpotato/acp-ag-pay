<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ลำดับการยืนยันคำสั่งซื้อผ่าน Stripe webhook บทที่ 7</title>
<desc>เมื่อ Stripe ประมวลผลการชำระเงินสำเร็จหรือล้มเหลว จะส่ง event มาที่ POST /api/webhooks/stripe พร้อมลายเซ็น webhook handler ตรวจลายเซ็นด้วย STRIPE_WEBHOOK_SECRET แล้วค้นหา order จาก payment intent id เพื่ออัปเดตสถานะเป็น paid หรือ failed ซึ่งหน้ายืนยันคำสั่งซื้อที่กำลัง poll อยู่จะเห็นการเปลี่ยนแปลงในรอบถัดไป</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="80" y1="60" x2="80" y2="370" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="280" y1="60" x2="280" y2="370" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="480" y1="60" x2="480" y2="370" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="620" y1="60" x2="620" y2="370" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<rect x="20" y="30" width="120" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="80" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Stripe</text>
<rect x="220" y="30" width="120" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="280" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">webhook.Handler</text>
<rect x="420" y="30" width="120" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="480" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">OrderStore</text>
<rect x="560" y="30" width="110" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="615" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">หน้ายืนยัน</text>
<line x1="80" y1="90" x2="280" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="82" font-family="sans-serif" font-size="12" fill="#5F5E5A">payment_intent.succeeded + signature</text>
<text x="290" y="120" font-family="sans-serif" font-size="12" fill="#5F5E5A">ตรวจลายเซ็นด้วย STRIPE_WEBHOOK_SECRET</text>
<text x="290" y="140" font-family="sans-serif" font-size="12" fill="#5F5E5A">ไม่มี secret → 503 / ลายเซ็นผิด → 400</text>
<line x1="280" y1="170" x2="480" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="290" y="162" font-family="sans-serif" font-size="12" fill="#5F5E5A">GetByPaymentIntent + Confirm(paid)</text>
<line x1="80" y1="210" x2="280" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="202" font-family="sans-serif" font-size="12" fill="#5F5E5A">200 received:true</text>
<line x1="620" y1="250" x2="480" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="242" font-family="sans-serif" font-size="12" fill="#5F5E5A">poll ทุก 3 วิ (บทที่ 6)</text>
<line x1="480" y1="290" x2="620" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490" y="282" font-family="sans-serif" font-size="12" fill="#5F5E5A">status: paid</text>
</svg>
