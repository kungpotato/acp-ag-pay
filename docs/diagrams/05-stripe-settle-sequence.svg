<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ลำดับการ settle การชำระเงินผ่าน Stripe บทที่ 5</title>
<desc>ผู้ใช้กดปุ่มชำระเงิน frontend เรียก POST /api/agent/pay ไปยัง PayHandler ซึ่งตรวจสอบว่า session ยัง pending อยู่ แล้วเรียก StripeSettler ถ้าไม่มี STRIPE_SECRET_KEY จะตอบ 503 ทันที ถ้ามี key จะสร้าง PaymentIntent จริงกับ Stripe แล้วอัปเดตสถานะ session เป็น ready_for_payment</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="80" y1="60" x2="80" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="260" y1="60" x2="260" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="440" y1="60" x2="440" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="600" y1="60" x2="600" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<rect x="20" y="30" width="120" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ผู้ใช้</text>
<rect x="200" y="30" width="120" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="260" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">CartPanel</text>
<rect x="380" y="30" width="120" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="440" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">PayHandler</text>
<rect x="540" y="30" width="120" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Stripe API</text>
<line x1="80" y1="90" x2="260" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="82" font-family="sans-serif" font-size="12" fill="#5F5E5A">กด "ชำระเงินผ่าน Stripe"</text>
<line x1="260" y1="130" x2="440" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="122" font-family="sans-serif" font-size="12" fill="#5F5E5A">POST /api/agent/pay</text>
<text x="450" y="160" font-family="sans-serif" font-size="12" fill="#5F5E5A">ตรวจสถานะ session ต้อง pending</text>
<text x="450" y="180" font-family="sans-serif" font-size="12" fill="#5F5E5A">ไม่มี STRIPE_SECRET_KEY → 503 ทันที</text>
<line x1="440" y1="210" x2="600" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="202" font-family="sans-serif" font-size="12" fill="#5F5E5A">สร้าง PaymentIntent(total, currency)</text>
<line x1="600" y1="250" x2="440" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="242" font-family="sans-serif" font-size="12" fill="#5F5E5A">payment_intent_id + client_secret</text>
<line x1="440" y1="290" x2="260" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="282" font-family="sans-serif" font-size="12" fill="#5F5E5A">session status = ready_for_payment</text>
<line x1="260" y1="330" x2="80" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="322" font-family="sans-serif" font-size="12" fill="#5F5E5A">แสดงผล settle</text>
</svg>
