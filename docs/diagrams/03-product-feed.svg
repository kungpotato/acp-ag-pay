<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>โครงสร้าง ACP product feed บทที่ 3</title>
<desc>Shopping agent ภายนอกเรียก GET /api/acp/products เพื่อค้นพบสินค้าทั้งหมดโดยไม่ต้องรู้จัก schema ภายในของร้าน ระบบแปลง Book จาก catalog store เป็น ACP Product ที่มี id, title, price และสถานะ availability</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="80" width="160" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="120" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Agent ภายนอก</text>
<text x="120" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">ไม่รู้จัก schema ร้าน</text>
<line x1="200" y1="105" x2="260" y2="105" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="97" font-family="sans-serif" font-size="12" fill="#5F5E5A">GET /api/acp/products</text>
<rect x="260" y="80" width="160" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">acp.FeedHandler</text>
<text x="340" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">แปลงจาก Book → Product</text>
<line x1="340" y1="130" x2="340" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260" y="170" width="160" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">catalog.Store</text>
<line x1="420" y1="105" x2="480" y2="105" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="480" y="80" width="160" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="560" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Product feed (JSON)</text>
<text x="560" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">id · price · availability</text>
</svg>
