<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>สถาปัตยกรรมระดับสูงของระบบร้านหนังสือ ACP</title>
<desc>ผู้ใช้คุยกับ agent ผ่าน Next.js frontend ซึ่งเรียก Go backend ที่รวม shopping agent, catalog และ ACP checkout จากนั้น backend เรียก Stripe เพื่อ settle การชำระเงิน และ Stripe ส่ง webhook กลับมายืนยันแบบ async</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="260" y="60" width="160" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ผู้ใช้ (แชท)</text>
<line x1="340" y1="110" x2="340" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="150" width="200" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Next.js frontend</text>
<text x="340" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">หน้าจอแชทซื้อหนังสือ</text>
<line x1="340" y1="200" x2="340" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="240" width="240" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Go backend (ACP)</text>
<text x="340" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">agent · catalog · checkout</text>
<line x1="340" y1="300" x2="340" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="322" font-family="sans-serif" font-size="12" fill="#5F5E5A">settle payment</text>
<rect x="260" y="340" width="160" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Stripe API</text>
<text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">ชำระเงิน + webhook</text>
<path d="M420 350 L540 350 L540 270 L460 270" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<text x="545" y="315" font-family="sans-serif" font-size="12" fill="#5F5E5A">webhook</text>
</svg>
